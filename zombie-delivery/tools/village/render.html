<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jinočany looks</title>
<!-- 8.9: tools/village's page: renderShot draws one shot's parts (tools/village/export.luau's SHOT) with three.js in a
     warm summer afternoon (a perspective camera, the sun from the south-west, soft shadows, a light haze) and returns
     the PNG. render.mjs drives it in headless Chromium; preview.py lays the sheets out. -->
<style>
html, body { margin: 0; background: #1d2127; }
canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.min.js';

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 40).rotateZ(-Math.PI / 2); // (Roblox's cylinder lies along X)
const unitBall = new THREE.SphereGeometry(0.5, 40, 24);
function prism(v, tris) {
  const pos = [];
  // (the triangles as tools/sandbox-map lists them, wound the other way round: their faces out, for a perspective view)
  for (const t of tris) for (const k of [t[0], t[2], t[1]]) pos.push(...v[k]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals(); // (no shared vertices: a flat normal a face)
  return g;
}
// a WedgePart: high at its +Z, its slope down to its -Z
const unitWedge = prism({ bfl: [-.5, -.5, -.5], bfr: [.5, -.5, -.5], bbl: [-.5, -.5, .5], bbr: [.5, -.5, .5], tbl: [-.5, .5, .5], tbr: [.5, .5, .5] },
  [['bfl', 'bbr', 'bfr'], ['bfl', 'bbl', 'bbr'], ['bbl', 'tbr', 'bbr'], ['bbl', 'tbl', 'tbr'], ['bfl', 'bfr', 'tbr'], ['bfl', 'tbr', 'tbl'], ['bfl', 'tbl', 'bbl'], ['bfr', 'bbr', 'tbr']]);
// a CornerWedgePart: its apex over its (+X, -Z) corner
const unitCorner = prism({ a: [-.5, -.5, -.5], b: [.5, -.5, -.5], c: [.5, -.5, .5], d: [-.5, -.5, .5], t: [.5, .5, -.5] },
  [['a', 'c', 'b'], ['a', 'd', 'c'], ['b', 'c', 't'], ['a', 'b', 't'], ['a', 't', 'd'], ['d', 't', 'c']]);
const ROUGH = { SmoothPlastic: 0.55, Plastic: 0.6, Metal: 0.5, Glass: 0.12, Grass: 0.95, LeafyGrass: 0.95, Ground: 0.97, Concrete: 0.9,
  Asphalt: 0.95, Slate: 0.8, WoodPlanks: 0.82, Wood: 0.8, Pebble: 0.95, Plaster: 0.92, ClayRoofTiles: 0.78, Brick: 0.9, Granite: 0.75, Sand: 0.97, Neon: 1 };

let renderer = null;
function makeRenderer(W, H) {
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);
  }
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
}

// One part record { p, r (9, row-major), s, c (0-255), t, mat, shape } → a mesh.
function meshOf(p, mats) {
  if (p.t >= 0.95) return null;
  let geo = unitBox, s = p.s;
  if (p.shape === 'Wedge') geo = unitWedge;
  else if (p.shape === 'CornerWedge') geo = unitCorner;
  else if (p.shape === 'Cylinder') geo = unitCyl;
  else if (p.shape === 'Ball') { geo = unitBall; const d = Math.min(...s); s = [d, d, d]; }
  else if (p.shape === 'Ellipsoid') geo = unitBall;
  const key = `${p.c.join(',')}|${p.mat}|${p.t.toFixed(2)}`;
  let mat = mats.get(key);
  if (!mat) {
    const color = new THREE.Color().setRGB(p.c[0] / 255, p.c[1] / 255, p.c[2] / 255, THREE.SRGBColorSpace);
    const opts = { color, roughness: ROUGH[p.mat] ?? 0.7, metalness: p.mat === 'Metal' ? 0.25 : p.mat === 'Glass' ? 0.1 : 0 };
    if (p.mat === 'Neon') { opts.emissive = color; opts.emissiveIntensity = 0.8; }
    mat = new THREE.MeshStandardMaterial(opts);
    if (p.t > 0.01) { mat.transparent = true; mat.opacity = 1 - p.t; mat.depthWrite = false; }
    mats.set(key, mat);
  }
  const m = new THREE.Mesh(geo, mat);
  const r = p.r, q = p.p;
  const m4 = new THREE.Matrix4().set(r[0], r[1], r[2], q[0], r[3], r[4], r[5], q[1], r[6], r[7], r[8], q[2], 0, 0, 0, 1);
  m4.multiply(new THREE.Matrix4().makeScale(s[0], s[1], s[2]));
  m.matrixAutoUpdate = false;
  m.matrix.copy(m4);
  const big = Math.max(...s);
  m.castShadow = p.t < 0.5 && big > 0.5 && !(s[1] <= 2.2 && big > 60); // (no shadow from the ground's tiles)
  m.receiveShadow = true;
  return m;
}

// The subject's box (its first `subject` parts): middle and radius.
function subjectBox(parts, n) {
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < n; i++) {
    const p = parts[i], r = p.r;
    for (let a = 0; a < 3; a++) {
      const reach = (Math.abs(r[a * 3]) * p.s[0] + Math.abs(r[a * 3 + 1]) * p.s[1] + Math.abs(r[a * 3 + 2]) * p.s[2]) / 2;
      lo[a] = Math.min(lo[a], p.p[a] - reach);
      hi[a] = Math.max(hi[a], p.p[a] + reach);
    }
  }
  const mid = lo.map((v, a) => (v + hi[a]) / 2);
  const radius = Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2;
  return { mid, radius, lo, hi };
}

window.renderShot = (shot) => {
  const v = shot.view;
  const W = v.w, H = v.h;
  makeRenderer(W, H);
  const scene = new THREE.Scene();
  const sky = new THREE.Color().setRGB(0.62, 0.77, 0.92, THREE.SRGBColorSpace);
  scene.background = sky;
  const box = subjectBox(shot.parts, shot.subject);
  const fov = v.fov || 40;
  let from, to;
  if (v.from) { from = new THREE.Vector3(...v.from); to = new THREE.Vector3(...v.to); }
  else {
    to = new THREE.Vector3(...box.mid);
    const dir = new THREE.Vector3(...v.dir).normalize();
    const dist = box.radius * (v.fit || 1) / Math.sin(THREE.MathUtils.degToRad(fov) / 2);
    from = to.clone().add(dir.multiplyScalar(dist));
  }
  const far = Math.max(4000, from.distanceTo(to) * 6);
  scene.fog = v.fog ? new THREE.Fog(sky, v.fog[0], v.fog[1]) : new THREE.Fog(sky, from.distanceTo(to) * 3, far);
  scene.add(new THREE.HemisphereLight(0xeaf2ff, 0x5e6a48, 1.2));
  const sun = new THREE.DirectionalLight(0xfff0d6, 2.5);
  const sd = new THREE.Vector3(...(v.sun || [-0.42, 1, 0.62])).normalize();
  // the shadows: around what the camera looks at (the subject, or the shot's target and a stretch beyond)
  const focus = v.from ? to : new THREE.Vector3(...box.mid);
  const reach = v.from ? Math.min(from.distanceTo(to) * 2.2, 2600) : box.radius * 1.4;
  sun.position.copy(focus).add(sd.clone().multiplyScalar(reach * 2 + 200));
  sun.target.position.copy(focus);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const sc = sun.shadow.camera;
  sc.left = -reach; sc.right = reach; sc.top = reach; sc.bottom = -reach; sc.near = 1; sc.far = reach * 5 + 400;
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);
  const mats = new Map();
  for (const p of shot.parts) {
    const m = meshOf(p, mats);
    if (m) scene.add(m);
  }
  const cam = new THREE.PerspectiveCamera(fov, W / H, Math.max(0.5, from.distanceTo(to) / 300), far); // (the near plane as far as it may: depth for the far ground)
  cam.position.copy(from);
  cam.lookAt(to);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  mats.forEach(m => m.dispose());
  return url;
};
window.ready = true;
</script>
</body>
</html>
