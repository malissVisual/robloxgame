<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Item models</title>
<style>html,body{margin:0;background:#14171c;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="module">
// 6.22: one inventory thing's look (export.luau's JSON) drawn as the game's ViewportFrame draws it: the in-game camera
// (ItemLooks.frame), Config.ItemModel's ambient and key light, on the UI's charcoal. No shadows (a ViewportFrame has none).
import * as THREE from './three.module.min.js';

const S = 320;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(1);
renderer.setSize(S, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 40).rotateZ(-Math.PI / 2); // Roblox: the axis along X
const unitBall = new THREE.SphereGeometry(0.5, 32, 20);
const unitWedge = (() => {
  const v = { bfl: [-.5, -.5, -.5], bfr: [.5, -.5, -.5], bbl: [-.5, -.5, .5], bbr: [.5, -.5, .5], tbl: [-.5, .5, .5], tbr: [.5, .5, .5] };
  const tris = [['bfl', 'bbr', 'bfr'], ['bfl', 'bbl', 'bbr'], ['bbl', 'tbr', 'bbr'], ['bbl', 'tbl', 'tbr'], ['bfl', 'bfr', 'tbr'], ['bfl', 'tbr', 'tbl'], ['bfl', 'tbl', 'bbl'], ['bfr', 'bbr', 'tbr']];
  const pos = [];
  for (const t of tris) for (const k of t) pos.push(...v[k]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
})();
const ROUGH = { SmoothPlastic: 0.45, Plastic: 0.6, Metal: 0.35, Glass: 0.1, Fabric: 0.92, Rubber: 0.9, Leather: 0.6, Wood: 0.8, WoodPlanks: 0.8, Cardboard: 0.9, Neon: 1 };
const METAL = { Metal: 0.45, DiamondPlate: 0.5 };
const srgb = c => new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
const rgb255 = c => new THREE.Color().setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace);

function mesh(p) {
  const geom = p.class === 'WedgePart' ? unitWedge : p.shape === 'Cylinder' ? unitCyl : p.shape === 'Ball' ? unitBall : unitBox;
  const neon = p.material === 'Neon';
  const opts = { color: srgb(p.color), roughness: ROUGH[p.material] ?? 0.6, metalness: METAL[p.material] ?? 0 };
  if (neon) { opts.emissive = srgb(p.color); opts.emissiveIntensity = 1.4; }
  if (p.opacity < 0.99) { opts.transparent = true; opts.opacity = Math.max(0.2, p.opacity); opts.depthWrite = false; }
  const m = new THREE.Mesh(geom, new THREE.MeshStandardMaterial(opts));
  const r = p.rotation, q = p.position, s = p.size;
  const sz = p.shape === 'Ball' ? [Math.min(...s), Math.min(...s), Math.min(...s)] : p.shape === 'Cylinder' ? [s[0], Math.min(s[1], s[2]), Math.min(s[1], s[2])] : s;
  const mtx = new THREE.Matrix4().set(r[0], r[1], r[2], q[0], r[3], r[4], r[5], q[1], r[6], r[7], r[8], q[2], 0, 0, 0, 1);
  mtx.multiply(new THREE.Matrix4().makeScale(sz[0], sz[1], sz[2]));
  m.matrixAutoUpdate = false;
  m.matrix.copy(mtx);
  m.renderOrder = p.opacity < 0.99 ? 1 : 0;
  return m;
}

window.renderScene = function (scene0) {
  const info = scene0.info;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14171c); // the thumbs' charcoal (Theme.Contract.charcoal)
  for (const p of scene0.parts) scene.add(mesh(p));
  scene.add(new THREE.AmbientLight(rgb255(info.ambient), 1.35));
  const key = new THREE.DirectionalLight(rgb255(info.light), 2.2);
  const d = new THREE.Vector3(...info.direction).normalize();
  key.position.set(-d.x, -d.y, -d.z).multiplyScalar(50);
  scene.add(key);
  const camera = new THREE.PerspectiveCamera(info.fov, 1, 0.05, 500);
  camera.position.set(...info.eye);
  camera.lookAt(new THREE.Vector3(...info.target));
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body>
</html>
