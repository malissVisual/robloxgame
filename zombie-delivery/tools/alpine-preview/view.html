<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #9cc4e8; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
// 7.1, the Alps: a 3/4 view of one stretch of shared/AlpineLayout.luau (render.py's export): the terrain's top as a
// height field coloured by its material (the cones' layers, the glaciers, the scree, the pass's cliff), the valley's
// grass, the roads and yards, the trees (a trunk and three ellipsoid tiers each, as server/Alpine.luau builds them),
// the huts, the meadows' flowers, the West Pass's road, barrier, portal and shutter. A sun with shadows, a blue haze.
import * as THREE from './three.module.min.js';

const data = await (await fetch('scene.json')).json();
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color().setRGB(0.62, 0.77, 0.92, THREE.SRGBColorSpace);
scene.background = SKY;
scene.fog = new THREE.Fog(new THREE.Color().setRGB(0.74, 0.83, 0.93, THREE.SRGBColorSpace), 700, 4200);
const rgb = c => new THREE.Color().setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace);

// The light: a high morning sun from the south-east, the sky's fill.
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x5a6a44, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
const g = data.stretch;
const cx = g.x0 + (g.nx - 1) * g.cell / 2, cz = g.z0 + (g.nz - 1) * g.cell / 2;
sun.position.set(cx + 900, 1400, cz + 700);
sun.target.position.set(cx, 0, cz);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const span = Math.max(g.nx, g.nz) * g.cell * 0.62;
Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 10, far: 4000 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// The ground: the terrain's top where the ring is, else the valley (grass, the winter's snow, the water).
const colors = {
  1: rgb(data.colors.Grass), 2: rgb(data.colors.Rock), 3: rgb(data.colors.Limestone), 4: rgb(data.colors.Snow),
  5: rgb(data.colors.Glacier), 6: rgb(data.colors.Ground),
};
const valley = rgb([96, 138, 60]), snowField = rgb([232, 236, 240]), water = rgb([64, 120, 150]);
const [rx0, rx1] = data.river, sea = data.sea, bounds = data.bounds;
function inWater(x, z) {
  if (z < bounds[1] - 300 || z > bounds[3] + 300) return false;
  return (x > rx0 && x < rx1) || (x > sea && x < bounds[2] + 250);
}
{
  const pos = new Float32Array(g.nx * g.nz * 3), col = new Float32Array(g.nx * g.nz * 3);
  for (let j = 0; j < g.nz; j++) for (let i = 0; i < g.nx; i++) {
    const k = j * g.nx + i, x = g.x0 + i * g.cell, z = g.z0 + j * g.cell;
    let h = g.h[k], c;
    if (h <= -900) {
      if (inWater(x, z)) { h = -3; c = water; }
      else { h = 0; c = (z < data.winterZ && x < rx0) ? snowField : valley; }
    } else c = colors[g.m[k]] || valley;
    // a little noise in the colour (the material's texture)
    const n = 0.94 + 0.12 * (Math.sin(x * 12.9898 + z * 78.233) * 43758.5453 % 1 + 1) % 1;
    pos.set([x, h, z], k * 3);
    col.set([c.r * n, c.g * n, c.b * n], k * 3);
  }
  const index = [];
  for (let j = 0; j < g.nz - 1; j++) for (let i = 0; i < g.nx - 1; i++) {
    const a = j * g.nx + i, b = a + 1, c = a + g.nx, d = c + 1;
    index.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(index);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
}

const inStretch = (x, z, pad = 0) => x > g.x0 - pad && x < g.x0 + (g.nx - 1) * g.cell + pad && z > g.z0 - pad && z < g.z0 + (g.nz - 1) * g.cell + pad;

// The roads and the yards (flat).
const asphalt = new THREE.MeshStandardMaterial({ color: rgb([58, 58, 62]), roughness: 0.9 });
for (const [ax, az, bx, bz, width] of data.roads) {
  if (!inStretch(ax, az, 400) && !inStretch(bx, bz, 400)) continue;
  const len = Math.hypot(bx - ax, bz - az);
  const m = new THREE.Mesh(new THREE.BoxGeometry(width, 0.4, len), asphalt);
  m.position.set((ax + bx) / 2, 0.2, (az + bz) / 2);
  m.rotation.y = Math.atan2(bx - ax, bz - az);
  m.receiveShadow = true;
  scene.add(m);
}
const dirt = new THREE.MeshStandardMaterial({ color: rgb([150, 128, 96]), roughness: 1 });
for (const [x0, z0, x1, z1] of data.yards) {
  if (!inStretch((x0 + x1) / 2, (z0 + z1) / 2, 300)) continue;
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.4, z1 - z0), dirt);
  m.position.set((x0 + x1) / 2, 0.1, (z0 + z1) / 2);
  m.receiveShadow = true;
  scene.add(m);
}

// Parts (the huts, the portal, the waterfall): blocks and wedges from the layout's numbers.
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitWedge = (() => {
  // Roblox's wedge: high at its +Z, its slope down to its -Z bottom edge
  const v = { bfl: [-.5, -.5, -.5], bfr: [.5, -.5, -.5], bbl: [-.5, -.5, .5], bbr: [.5, -.5, .5], tbl: [-.5, .5, .5], tbr: [.5, .5, .5] };
  const tris = [['bfl', 'bbr', 'bfr'], ['bfl', 'bbl', 'bbr'], ['bbl', 'tbr', 'bbr'], ['bbl', 'tbl', 'tbr'], ['bfl', 'bfr', 'tbr'], ['bfl', 'tbr', 'tbl'], ['bfl', 'tbl', 'bbl'], ['bfr', 'bbr', 'tbr']];
  const pos = [];
  for (const t of tris) for (const k of t) pos.push(...v[k]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
})();
const unitBall = new THREE.SphereGeometry(0.5, 14, 10);
const unitCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 10);
function part(spec, lift = 0) {
  const geo = spec.shape === 'wedge' ? unitWedge : spec.shape === 'ellipsoid' || spec.shape === 'ball' ? unitBall : spec.shape === 'cylinder' ? unitCyl : unitBox;
  const mat = new THREE.MeshStandardMaterial({
    color: rgb(spec.color), roughness: 0.85,
    emissive: spec.material === 'Neon' ? rgb(spec.color) : 0x000000,
    transparent: spec.transparency > 0, opacity: 1 - (spec.transparency || 0),
  });
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(spec.sx, spec.sy, spec.sz);
  m.position.set(spec.x, spec.y + lift, spec.z);
  m.rotation.order = 'YXZ';
  m.rotation.set(spec.pitch || 0, spec.yaw, 0);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
for (const entry of data.huts) if (inStretch(entry.hut.x, entry.hut.z, 200)) entry.parts.forEach(p => part(p));
for (const entry of data.portals) {
  entry.parts.forEach(p => part(p));
  for (const s of entry.signs) {
    part({ shape: 'block', x: s.x, y: s.y, z: s.z, sx: s.w, sy: s.h, sz: 0.3, yaw: s.yaw, color: s.background || [24, 27, 32], material: 'Metal' });
  }
}
data.waterfall.forEach(p => part(p));

// The trees: instanced trunks and tiers (the layout's own parts for one tree, scaled to each).
const trees = data.trees.filter(t => inStretch(t[0], t[2], 60));
{
  const variants = data.treeColors.map(rgb);
  const trunkMesh = new THREE.InstancedMesh(unitCyl, new THREE.MeshStandardMaterial({ color: rgb(data.trunk), roughness: 1 }), trees.length);
  const tierMesh = new THREE.InstancedMesh(unitBall, new THREE.MeshStandardMaterial({ roughness: 1 }), trees.length * 3);
  const tiers = [[0.36, 0.38, 0.42, 0.86], [0.58, 0.28, 0.36, 1.0], [0.80, 0.16, 0.40, 1.12]];
  const o = new THREE.Object3D();
  trees.forEach(([x, y, z, h, variant, snowy, slope, yaw], n) => {
    const d = 1.3 + h * 0.024;
    o.position.set(x, y + h * 0.27 - 1, z); o.rotation.set(0, 0, 0); o.scale.set(d, h * 0.54 + 2, d); o.updateMatrix();
    trunkMesh.setMatrixAt(n, o.matrix);
    tiers.forEach(([mid, w, th, shade], k) => {
      o.position.set(x, y + h * mid, z); o.rotation.set(0, yaw, 0); o.scale.set(h * w, h * th, h * w * 0.94); o.updateMatrix();
      tierMesh.setMatrixAt(n * 3 + k, o.matrix);
      let c = variants[variant - 1].clone().multiplyScalar(shade);
      if (snowy) c = k === 2 ? rgb(data.snowy) : c.lerp(rgb(data.snowy), 0.22);
      tierMesh.setColorAt(n * 3 + k, c);
    });
  });
  for (const m of [trunkMesh, tierMesh]) { m.castShadow = m.receiveShadow = true; scene.add(m); }
}
// The wildflowers.
{
  const flowers = [];
  for (const p of data.patches) if (inStretch(p.x, p.z, 50)) flowers.push(...p.flowers);
  const mesh = new THREE.InstancedMesh(unitBall, new THREE.MeshStandardMaterial({ roughness: 0.8 }), Math.max(flowers.length, 1));
  const o = new THREE.Object3D();
  flowers.forEach(([x, z, size, color], n) => {
    o.position.set(x, size * 0.3, z); o.scale.set(size, size, size); o.updateMatrix();
    mesh.setMatrixAt(n, o.matrix); mesh.setColorAt(n, rgb(color));
  });
  mesh.count = flowers.length;
  scene.add(mesh);
}

// The camera: given by render.py (eye, target, field of view), else from inside the valley toward the West Pass.
const cam = data.camera || { eye: [-1560, 230, 980], target: [-2330, 110, 470], fov: 48 };
const camera = new THREE.PerspectiveCamera(cam.fov, W / H, 2, 9000);
camera.position.set(...cam.eye);
camera.lookAt(new THREE.Vector3(...cam.target));
renderer.render(scene, camera);
window.ready = true;
</script>
</body>
</html>
