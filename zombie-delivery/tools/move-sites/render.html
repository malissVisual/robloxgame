<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Move sites</title>
<style>html,body{margin:0;background:#9fb4c8;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="module">
// 7.0: the moves' world (check.py --export: every part MoveSites built, its text, and the context round it) drawn with
// three.js: boxes, cylinders (their axis along X) and wedges at their CFrames, Neon glowing, glass see-through, a sun with
// shadows, and each SurfaceGui's lines on its face (scaled to fit like TextScaled; Gotham's weights as DejaVu Sans,
// emoji from Noto Color Emoji). window.loadScene(records), then window.renderView(view) for each camera.
import * as THREE from './three.module.min.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 32).rotateZ(-Math.PI / 2); // Roblox: the axis along X
const unitWedge = (() => {
  const v = { bfl: [-.5, -.5, -.5], bfr: [.5, -.5, -.5], bbl: [-.5, -.5, .5], bbr: [.5, -.5, .5], tbl: [-.5, .5, .5], tbr: [.5, .5, .5] };
  const tris = [['bfl', 'bbr', 'bfr'], ['bfl', 'bbl', 'bbr'], ['bbl', 'tbr', 'bbr'], ['bbl', 'tbl', 'tbr'], ['bfl', 'bfr', 'tbr'], ['bfl', 'tbr', 'tbl'], ['bfl', 'tbl', 'bbl'], ['bfr', 'bbr', 'tbr']];
  const pos = [];
  for (const t of tris) for (const k of t) pos.push(...v[k]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
})();
const ROUGH = { SmoothPlastic: 0.5, Metal: 0.45, Concrete: 0.95, Fabric: 0.95, Wood: 0.8, WoodPlanks: 0.85, Glass: 0.1, Neon: 1, Rubber: 0.9, Slate: 0.9, Grass: 1, Asphalt: 1, DiamondPlate: 0.5 };
const METAL = { Metal: 0.35, DiamondPlate: 0.5 };
const rgb = c => new THREE.Color().setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace);
const FONTS = { GothamBlack: '900', GothamBold: 'bold', GothamMedium: '500' };

// One face's text as a canvas: the back panel (inset), the lines one under the other, centred, each scaled to fit.
function textCanvas(w, width, height) {
  const k = Math.min(96, 2048 / Math.max(width, height));
  const W = Math.max(8, Math.round(width * k)), H = Math.max(8, Math.round(height * k));
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  let x0 = 0, y0 = 0, hw = W, hh = H;
  if (w.back) {
    const inset = w.inset || 0;
    x0 = W * inset; y0 = H * inset; hw = W * (1 - 2 * inset); hh = H * (1 - 2 * inset);
    ctx.fillStyle = `rgb(${w.back.join(',')})`;
    ctx.fillRect(x0, y0, hw, hh);
  }
  const lines = w.lines || [];
  const pad = 0.02 * hh;
  const total = lines.reduce((s, l) => s + l.size * hh, 0) + pad * Math.max(0, lines.length - 1);
  let y = y0 + (hh - total) / 2;
  for (const l of lines) {
    const boxH = l.size * hh, boxW = 0.94 * hw;
    const weight = FONTS[l.font] || '500';
    ctx.font = `${weight} 100px "DejaVu Sans", "Noto Color Emoji", sans-serif`;
    const wide = ctx.measureText(l.text).width / 100;
    const px = Math.max(1, Math.min(boxH * 0.92, boxW / Math.max(wide, 0.01)));
    ctx.font = `${weight} ${px}px "DejaVu Sans", "Noto Color Emoji", sans-serif`;
    ctx.fillStyle = `rgb(${l.color.join(',')})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(l.text, x0 + hw / 2, y + boxH / 2);
    y += boxH + pad;
  }
  return canvas;
}

const FACE = {
  Front: { dims: s => [s[0], s[1]], at: s => [0, 0, -s[2] / 2 - 0.012], turn: [0, Math.PI, 0] },
  Back: { dims: s => [s[0], s[1]], at: s => [0, 0, s[2] / 2 + 0.012], turn: [0, 0, 0] },
  Right: { dims: s => [s[2], s[1]], at: s => [s[0] / 2 + 0.012, 0, 0], turn: [0, Math.PI / 2, 0] },
  Left: { dims: s => [s[2], s[1]], at: s => [-s[0] / 2 - 0.012, 0, 0], turn: [0, -Math.PI / 2, 0] },
};

function frameOf(p) {
  const r = p.rotation, q = p.position;
  return new THREE.Matrix4().set(r[0], r[1], r[2], q[0], r[3], r[4], r[5], q[1], r[6], r[7], r[8], q[2], 0, 0, 0, 1);
}

function addPart(scene, p) {
  const shape = p.shape || 'Block';
  const geom = shape === 'Wedge' ? unitWedge : shape === 'Cylinder' ? unitCyl : unitBox;
  const opts = { color: rgb(p.color), roughness: ROUGH[p.material] ?? 0.6, metalness: METAL[p.material] ?? 0 };
  if (p.material === 'Neon') { opts.emissive = rgb(p.color); opts.emissiveIntensity = 0.9; }
  let opacity = 1 - (p.transparency || 0);
  if (p.material === 'Glass') opacity = Math.min(opacity, 0.75);
  if (opacity < 0.99) { opts.transparent = true; opts.opacity = Math.max(0.15, opacity); opts.depthWrite = false; }
  const m = new THREE.Mesh(geom, new THREE.MeshStandardMaterial(opts));
  const s = p.size;
  const sz = shape === 'Cylinder' ? [s[0], Math.min(s[1], s[2]), Math.min(s[1], s[2])] : s;
  const frame = frameOf(p);
  m.matrixAutoUpdate = false;
  m.matrix.copy(frame.clone().multiply(new THREE.Matrix4().makeScale(sz[0], sz[1], sz[2])));
  m.castShadow = opacity > 0.9 && Math.max(...s) > 0.6;
  m.receiveShadow = true;
  scene.add(m);
  for (const w of Array.isArray(p.words) ? p.words : []) {
    const face = FACE[w.face];
    if (!face) continue;
    const [fw, fh] = face.dims(s);
    const tex = new THREE.CanvasTexture(textCanvas(w, fw, fh));
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
    const local = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(...face.turn));
    local.setPosition(...face.at(s));
    plane.matrixAutoUpdate = false;
    plane.matrix.copy(frame.clone().multiply(local));
    plane.renderOrder = 2;
    scene.add(plane);
  }
}

let scene = null, sun = null;
window.loadScene = function (records) {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb4c8);
  scene.fog = new THREE.Fog(0x9fb4c8, 220, 520);
  scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x5a564c, 1.25));
  sun = new THREE.DirectionalLight(0xfff1dc, 2.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);
  scene.add(sun.target);
  for (const r of records) if (r.kind === 'part' || r.kind === 'context') addPart(scene, r);
  window.loaded = records.length;
};

window.renderView = function (view) {
  const [W, H] = view.size;
  renderer.setSize(W, H);
  const camera = new THREE.PerspectiveCamera(view.fov || 45, W / H, 0.3, 1200);
  camera.position.set(...view.eye);
  camera.lookAt(new THREE.Vector3(...view.target));
  // the sun high in the south-west, its shadow box round the view's target
  const t = view.target;
  sun.position.set(t[0] - 60, t[1] + 120, t[2] + 70);
  sun.target.position.set(...t);
  const reach = view.shadow || 70;
  Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach, near: 1, far: 400 });
  sun.shadow.camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};
window.ready = true;
</script>
</body>
</html>
